<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skyapp</title>
  <style>
    :root {
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 2px 8px rgba(0,0,0,.08);
      --shadow-hover: 0 8px 24px rgba(0,0,0,.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ---- header ---- */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      height: 60px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .logo {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -.02em;
    }
    .logo span { color: var(--text); }

    /* ---- main ---- */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px 60px;
    }

    .page-title {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .page-sub {
      color: var(--muted);
      font-size: .95rem;
      margin-bottom: 36px;
    }

    /* ---- grid ---- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    /* ---- tile ---- */
    .tile {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 24px 24px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: var(--shadow);
      transition: box-shadow .2s, transform .2s;
      cursor: pointer;
    }
    .tile:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-3px);
    }

    .tile-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      flex-shrink: 0;
    }

    .tile-name {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.3;
    }
    .tile-desc {
      font-size: .82rem;
      color: var(--muted);
      line-height: 1.5;
      flex: 1;
    }
    .tile-arrow {
      font-size: .8rem;
      color: var(--accent);
      font-weight: 600;
      margin-top: 4px;
    }

    /* ---- color variants ---- */
    .green  { background: #dcfce7; }
    .blue   { background: #dbeafe; }
    .purple { background: #ede9fe; }
    .orange { background: #ffedd5; }
    .pink   { background: #fce7f3; }
    .teal   { background: #ccfbf1; }

    /* ---- footer ---- */
    footer {
      text-align: center;
      color: var(--muted);
      font-size: .8rem;
      padding: 24px;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Sky<span>app</span></div>
</header>

<main>
  <h1 class="page-title">Aplikacje</h1>
  <p class="page-sub">Kliknij kafelek, aby uruchomić aplikację.</p>

  <div class="grid">

    <a class="tile" href="https://andrzejdlu-ops.github.io/kalkulator-premii/">
      <div class="tile-icon green">💰</div>
      <div>
        <div class="tile-name">Kalkulator Premii</div>
        <div class="tile-desc">Obliczanie premii miesięcznej z uwzględnieniem nieobecności pracowników.</div>
      </div>
      <div class="tile-arrow">Otwórz →</div>
    </a>

    <!-- kolejne kafelki będą tu dodawane -->

  </div>
</main>

<footer>Skyware Sp. z o.o.</footer>

</body>
</html>
